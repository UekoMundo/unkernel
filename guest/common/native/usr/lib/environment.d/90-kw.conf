# The GPU is virgl on the browser's WebGL2: OpenGL ES 3, and the host shows
# no cursor plane, so the compositors draw the pointer themselves.

COGL_DRIVER=gles2
MUTTER_DEBUG_DISABLE_HW_CURSORS=1
KWIN_COMPOSE=O2ES
KWIN_FORCE_SW_CURSOR=1
WLR_NO_HARDWARE_CURSORS=1
